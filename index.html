<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Alpha World 🌍 Learn A to Z!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #87CEEB;
    --grass: #7BC67E;
    --sun: #FFD93D;
    --cloud: #ffffff;
    --card-shadow: 0 8px 32px rgba(0,0,0,0.18);
    --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #87CEEB 0%, #B0E2FF 40%, #C8F0A0 70%, #7BC67E 100%);
    overflow-x: hidden;
    position: relative;
  }

  /* Floating clouds & sun (same as before, kept for charm) */
  .cloud {
    position: fixed;
    background: white;
    border-radius: 50px;
    opacity: 0.85;
    animation: floatCloud linear infinite;
    z-index: 0;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud-1 { width: 120px; height: 40px; top: 8%; left: -130px; animation-duration: 28s; }
  .cloud-1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
  .cloud-1::after  { width: 40px; height: 40px; top: -20px; left: 55px; }
  .cloud-2 { width: 90px; height: 30px; top: 18%; left: -100px; animation-duration: 35s; }
  .cloud-2::before { width: 45px; height: 45px; top: -25px; left: 10px; }
  .cloud-3 { width: 140px; height: 45px; top: 5%; left: -150px; animation-duration: 40s; }
  @keyframes floatCloud {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 200px)); }
  }
  .sun {
    position: fixed; top: 20px; right: 40px; width: 70px; height: 70px;
    background: radial-gradient(circle, #FFE066, #FFD93D); border-radius: 50%;
    box-shadow: 0 0 0 12px rgba(255,217,61,0.25); z-index: 0;
  }
  .sparkle {
    position: fixed; pointer-events: none; font-size: 28px;
    animation: sparkleUp 1.2s ease-out forwards; z-index: 999;
  }
  @keyframes sparkleUp {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(0.3); opacity: 0; }
  }
  header { position: relative; z-index: 10; text-align: center; padding: 28px 20px 10px; }
  .logo {
    font-family: 'Fredoka One', cursive; font-size: clamp(2rem, 6vw, 3.8rem);
    color: #fff; text-shadow: 0 4px 0 #F4845F, 0 6px 14px rgba(0,0,0,0.2);
  }
  .tagline { font-size: clamp(0.9rem, 2.5vw, 1.2rem); color: #fff; font-weight: 700; }

  /* Category selector */
  .category-bar {
    position: relative; z-index: 10; display: flex; justify-content: center; gap: 12px;
    padding: 10px 16px; flex-wrap: wrap;
  }
  .cat-btn {
    font-family: 'Fredoka One', cursive; background: rgba(255,255,255,0.3); backdrop-filter: blur(6px);
    border: 2px solid white; border-radius: 40px; padding: 8px 18px; color: white;
    font-size: 1rem; cursor: pointer; transition: 0.2s var(--bounce);
  }
  .cat-btn.active { background: white; color: #F4845F; border-color: #F4845F; transform: scale(1.05); }
  
  /* Mode switch */
  .mode-bar {
    position: relative; z-index: 10; display: flex; justify-content: center; gap: 10px; padding: 8px 20px;
  }
  .mode-btn {
    font-weight: 900; font-size: 0.85rem; padding: 6px 18px; border-radius: 30px; border: none;
    cursor: pointer; transition: all 0.2s var(--bounce);
  }
  .mode-btn.inactive { background: rgba(255,255,255,0.4); color: rgba(255,255,255,0.9); }
  .mode-btn.active   { background: #fff; color: #F4845F; box-shadow: 0 4px 14px rgba(0,0,0,0.15); transform: scale(1.05); }

  /* Alphabet tabs */
  .tabs-wrapper {
    position: relative; z-index: 10; padding: 8px 16px 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .tabs { display: flex; gap: 8px; width: max-content; margin: 0 auto; }
  .tab-btn {
    font-family: 'Fredoka One', cursive; font-size: 1.1rem; width: 42px; height: 42px;
    border-radius: 12px; border: 3px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.35);
    color: #fff; cursor: pointer; backdrop-filter: blur(4px);
  }
  .tab-btn.active { background: #fff; color: #F4845F; border-color: #F4845F; transform: scale(1.2); }

  .stage { position: relative; z-index: 10; padding: 20px 16px 40px; max-width: 900px; margin: 0 auto; }
  
  /* Learn view */
  .letter-view { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .big-letter-card {
    background: #fff; border-radius: 32px; padding: 20px 30px; box-shadow: var(--card-shadow);
    display: flex; align-items: center; gap: 24px; cursor: pointer; width: 100%; max-width: 500px;
  }
  .letter-glyph {
    font-family: 'Fredoka One', cursive; font-size: clamp(4rem, 12vw, 7rem);
    background: linear-gradient(135deg, #F4845F, #FF6B9D); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .letter-word { font-family: 'Fredoka One', cursive; font-size: clamp(1.2rem, 4vw, 2rem); color: #333; }
  .animal-display { font-size: clamp(5rem, 18vw, 9rem); filter: drop-shadow(0 8px 18px rgba(0,0,0,0.15)); cursor: pointer; }
  .animal-name-tag {
    background: #fff; border-radius: 20px; padding: 10px 28px; font-family: 'Fredoka One', cursive;
    font-size: clamp(1.2rem, 4vw, 1.8rem); box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  .sound-btn {
    background: linear-gradient(135deg, #F4845F, #FF6B9D); color: #fff; border: none; border-radius: 50px;
    padding: 12px 32px; font-family: 'Fredoka One', cursive; font-size: 1.2rem; cursor: pointer;
  }
  
  /* Grid explore */
  .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
  .grid-card {
    background: #fff; border-radius: 22px; padding: 16px 10px; text-align: center; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1); transition: 0.2s var(--bounce);
  }
  .grid-card:hover { transform: translateY(-6px); }
  .grid-emoji { font-size: 2.8rem; display: block; }
  .grid-letter { font-size: 1.6rem; font-weight: bold; background: linear-gradient(135deg, #F4845F, #FF6B9D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .grid-name { font-size: 0.75rem; font-weight: 900; color: #666; }

  /* Quiz */
  .quiz-view { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .quiz-question { font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: white; text-align: center; }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 420px; }
  .quiz-option {
    background: #fff; border-radius: 22px; padding: 15px; text-align: center; cursor: pointer;
    transition: 0.2s; font-family: 'Fredoka One', cursive;
  }
  .quiz-option.correct { background: #C8F5C8; border: 3px solid #4CAF50; }
  .quiz-option.wrong { background: #FFE0E0; border: 3px solid #E53935; }
  .next-btn {
    background: #2F80ED; color: white; border: none; border-radius: 50px; padding: 12px 32px;
    font-family: 'Fredoka One', cursive; font-size: 1.2rem; cursor: pointer; display: none;
  }
  .next-btn.show { display: block; }
  .score-bar { font-size: 1.5rem; margin: 10px 0; }
  .mascot { position: fixed; bottom: 20px; right: 20px; font-size: 3.5rem; cursor: pointer; z-index: 50; }
  .confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
</style>
</head>
<body>
<div class="sun"></div>
<div class="cloud cloud-1"></div><div class="cloud cloud-2"></div><div class="cloud cloud-3"></div>

<div class="mode-bar">

  <button class="mode-btn inactive" onclick="setMode('explore')" id="mode-explore">🔍 Explore</button>
  <button class="mode-btn inactive" onclick="setMode('quiz')" id="mode-quiz">🎮 Quiz</button>
</div>

<div class="tabs-wrapper" id="tabsWrapper"><div class="tabs" id="tabs"></div></div>
<div class="stage" id="stage"></div>

let currentCategory = 'animals';
let currentIdx = 0;
let currentMode = 'learn';
let quizState = { score: 0, answered: false, correctIdx: null, options: [] };
const synth = window.speechSynthesis;

// Helper: get current data array
function getData() { return VOCAB[currentCategory]; }

// Build alphabet tabs based on current category
function buildTabs() {
  const data = getData();
  const tabsDiv = document.getElementById('tabs');
  tabsDiv.innerHTML = '';
  data.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === currentIdx ? ' active' : '');
    btn.textContent = item.letter;
    btn.onclick = () => { currentIdx = i; updateTabs(); if(currentMode !== 'quiz') renderCurrentView(); };
    tabsDiv.appendChild(btn);
  });
}
function updateTabs() {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIdx);
    if (i === currentIdx) b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
}

// Category switching
function setCategory(cat) {
  currentCategory = cat;
  currentIdx = 0;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  buildTabs();
  if (currentMode !== 'quiz') renderCurrentView();
  else renderQuiz(); // reset quiz on category change
}

// Render based on mode
function renderCurrentView() {
  if (currentMode === 'learn') renderLearn();
  else if (currentMode === 'explore') renderExplore();
}

// LEARN MODE
function renderLearn() {
  const item = getData()[currentIdx];
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="letter-view">
      <div class="big-letter-card" onclick="speakFull()">
        <div class="letter-glyph">${item.letter}</div>
        <div class="letter-info"><div class="letter-word">${item.letter} for ${item.name}</div></div>
      </div>
      <div class="animal-display" onclick="speakItem()">${item.emoji}</div>
      <div class="animal-name-tag">${item.name}</div>
      <button class="sound-btn" onclick="speakFull()">🔊 Hear it!</button>
    </div>
  `;
  setTimeout(() => speakFull(), 400);
}
function speakFull() { speak(getData()[currentIdx].sound); spawnSparkles(); }
function speakItem() { speak(getData()[currentIdx].name); spawnSparkles(); }

// EXPLORE MODE (Grid)
function renderExplore() {
  const data = getData();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="grid-view" id="gridView"></div>`;
  const grid = document.getElementById('gridView');
  data.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'grid-card';
    card.innerHTML = `<span class="grid-emoji">${item.emoji}</span>
                      <span class="grid-letter">${item.letter}</span>
                      <span class="grid-name">${item.name}</span>`;
    card.onclick = () => { speak(item.sound); spawnSparkles(); };
    grid.appendChild(card);
  });
}

// QUIZ MODE

  const data = getData();
  const correctIdx = Math.floor(Math.random() * 26);
  const correct = data[correctIdx];
  let wrongIndices = [];
  while (wrongIndices.length < 3) {
    let r = Math.floor(Math.random() * 26);
    if (r !== correctIdx && !wrongIndices.includes(r)) wrongIndices.push(r);
  }
  const options = [correctIdx, ...wrongIndices].sort(() => Math.random() - 0.5);
  quizState = { score: quizState.score || 0, answered: false, correctIdx, options };
  
  const stars = '⭐'.repeat(Math.min(quizState.score,5)) + '☆'.repeat(5 - Math.min(quizState.score,5));
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="quiz-view">
      <div class="score-bar">${stars}</div>
      <div class="quiz-question">Which word starts with the letter <span style="font-size:3rem;background:linear-gradient(135deg,#F4845F,#FF6B9D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${correct.letter}</span>?</div>
      <div class="quiz-options" id="quizOptions">
        ${options.map(idx => `<div class="quiz-option" onclick="answerQuiz(${idx})"><span class="quiz-option-emoji">${data[idx].emoji}</span><br>${data[idx].name}</div>`).join('')}
      </div>
      <button class="next-btn" id="nextBtn" onclick="renderQuiz()">Next ➡️</button>
    </div>
  `;
  setTimeout(() => speak(`Which word starts with the letter ${correct.letter}?`), 300);
}
function answerQuiz(selectedIdx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const data = getData();
  const isCorrect = (selectedIdx === quizState.correctIdx);
  const targetDiv = document.querySelector(`.quiz-option[onclick="answerQuiz(${selectedIdx})"]`);
  if (isCorrect) {
    quizState.score = Math.min(quizState.score + 1, 5);
    targetDiv.classList.add('correct');
    speak("Yay! Correct! Great job!");
    spawnConfetti();
  } else {
    quizState.score = Math.max(quizState.score - 1, 0);
    targetDiv.classList.add('wrong');
    const correctDiv = document.querySelector(`.quiz-option[onclick="answerQuiz(${quizState.correctIdx})"]`);
    if(correctDiv) correctDiv.classList.add('correct');
    speak(`Oops! That is ${data[quizState.correctIdx].name}! Try again!`);
  }
  document.getElementById('nextBtn').classList.add('show');
  const stars = '⭐'.repeat(Math.min(quizState.score,5)) + '☆'.repeat(5 - Math.min(quizState.score,5));
  document.querySelector('.score-bar').innerHTML = stars;
}

// Helper functions
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.id === `mode-${mode}`);
    btn.classList.toggle('inactive', btn.id !== `mode-${mode}`);
  });
  document.getElementById('tabsWrapper').style.display = mode === 'quiz' ? 'none' : 'block';
  if (mode === 'quiz') renderQuiz();
  else renderCurrentView();
}
function speak(text) { if(synth){ synth.cancel(); let u = new SpeechSynthesisUtterance(text); u.rate=0.85; u.pitch=1.2; synth.speak(u); } }
function spawnSparkles() { for(let i=0;i<5;i++){ let el=document.createElement('div'); el.className='sparkle'; el.textContent=['⭐','✨','🌟','🎉'][Math.floor(Math.random()*4)]; el.style.left=Math.random()*80+'vw'; el.style.top=Math.random()*60+'vh'; document.body.appendChild(el); setTimeout(()=>el.remove(),1500); } }
function spawnConfetti() { const layer=document.getElementById('confettiLayer'); for(let i=0;i<40;i++){ let p=document.createElement('div'); p.className='confetti-piece'; p.style.position='absolute'; p.style.width='8px'; p.style.height='8px'; p.style.background=['#FF6B6B','#FFD93D','#6BCB77'][Math.floor(Math.random()*3)]; p.style.left=Math.random()*100+'vw'; p.style.animation=`confettiFall ${1+Math.random()*2}s linear forwards`; p.style.top='-10px'; layer.appendChild(p); setTimeout(()=>p.remove(),3000); } }
function mascotTalk() { const lines=["Tap any tile to hear it! 🎤","You're doing amazing! 🌟","Keep learning new words!","Try Quiz mode!"]; speak(lines[Math.floor(Math.random()*lines.length)]); }

// Add confetti animation keyframe
const styleSheet = document.createElement("style");
styleSheet.textContent = `@keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity:1; } 100% { transform: translateY(100vh) rotate(720deg); opacity:0; } }`;
document.head.appendChild(styleSheet);

// Event listeners for category
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => setCategory(btn.dataset.cat));
});

// Initialize
buildTabs();
renderLearn();
</script>
</body>
