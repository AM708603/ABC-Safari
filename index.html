<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaZoo 🦁 Learn A-Z!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #87CEEB;
    --grass: #7BC67E;
    --sun: #FFD93D;
    --cloud: #ffffff;
    --card-shadow: 0 8px 32px rgba(0,0,0,0.18);
    --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #87CEEB 0%, #B0E2FF 40%, #C8F0A0 70%, #7BC67E 100%);
    overflow-x: hidden;
    position: relative;
  }

  /* Floating clouds */
  .cloud {
    position: fixed;
    background: white;
    border-radius: 50px;
    opacity: 0.85;
    animation: floatCloud linear infinite;
    z-index: 0;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud-1 { width: 120px; height: 40px; top: 8%; left: -130px; animation-duration: 28s; animation-delay: 0s; }
  .cloud-1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
  .cloud-1::after  { width: 40px; height: 40px; top: -20px; left: 55px; }
  .cloud-2 { width: 90px; height: 30px; top: 18%; left: -100px; animation-duration: 35s; animation-delay: -10s; }
  .cloud-2::before { width: 45px; height: 45px; top: -25px; left: 10px; }
  .cloud-2::after  { width: 35px; height: 35px; top: -18px; left: 45px; }
  .cloud-3 { width: 140px; height: 45px; top: 5%; left: -150px; animation-duration: 40s; animation-delay: -20s; }
  .cloud-3::before { width: 70px; height: 70px; top: -38px; left: 20px; }
  .cloud-3::after  { width: 50px; height: 50px; top: -25px; left: 70px; }

  @keyframes floatCloud {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 200px)); }
  }

  /* Sun */
  .sun {
    position: fixed;
    top: 20px; right: 40px;
    width: 70px; height: 70px;
    background: radial-gradient(circle, #FFE066, #FFD93D);
    border-radius: 50%;
    box-shadow: 0 0 0 12px rgba(255,217,61,0.25), 0 0 0 24px rgba(255,217,61,0.12);
    animation: sunPulse 3s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes sunPulse {
    0%,100% { box-shadow: 0 0 0 12px rgba(255,217,61,0.25), 0 0 0 24px rgba(255,217,61,0.12); }
    50%      { box-shadow: 0 0 0 18px rgba(255,217,61,0.30), 0 0 0 36px rgba(255,217,61,0.15); }
  }

  /* Stars/sparkles that appear on click */
  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 28px;
    animation: sparkleUp 1.2s ease-out forwards;
    z-index: 999;
  }
  @keyframes sparkleUp {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(0.3); opacity: 0; }
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 28px 20px 10px;
  }
  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    color: #fff;
    text-shadow: 0 4px 0 #F4845F, 0 6px 14px rgba(0,0,0,0.2);
    letter-spacing: 2px;
    display: inline-block;
    animation: logoWobble 4s ease-in-out infinite;
  }
  @keyframes logoWobble {
    0%,100% { transform: rotate(-1deg); }
    50%      { transform: rotate(1deg); }
  }
  .tagline {
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    color: #fff;
    font-weight: 700;
    margin-top: 4px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
    letter-spacing: 1px;
  }

  /* Alphabet tabs strip */
  .tabs-wrapper {
    position: relative;
    z-index: 10;
    padding: 14px 16px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs-wrapper::-webkit-scrollbar { display: none; }
  .tabs {
    display: flex;
    gap: 8px;
    width: max-content;
    margin: 0 auto;
  }
  .tab-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    width: 42px; height: 42px;
    border-radius: 12px;
    border: 3px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.35);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s var(--bounce);
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    backdrop-filter: blur(4px);
    flex-shrink: 0;
  }
  .tab-btn:hover { transform: scale(1.15) translateY(-3px); background: rgba(255,255,255,0.6); }
  .tab-btn.active {
    background: #fff;
    color: #F4845F;
    border-color: #F4845F;
    transform: scale(1.2) translateY(-4px);
    box-shadow: 0 6px 18px rgba(244,132,95,0.4);
  }

  /* Mode switch */
  .mode-bar {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 16px 20px 4px;
  }
  .mode-btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 0.85rem;
    padding: 8px 18px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    transition: all 0.2s var(--bounce);
    letter-spacing: 0.5px;
  }
  .mode-btn.inactive { background: rgba(255,255,255,0.4); color: rgba(255,255,255,0.9); }
  .mode-btn.active   { background: #fff; color: #F4845F; box-shadow: 0 4px 14px rgba(0,0,0,0.15); transform: scale(1.05); }

  /* Main stage */
  .stage {
    position: relative;
    z-index: 10;
    padding: 20px 16px 40px;
    max-width: 900px;
    margin: 0 auto;
  }

  /* ===== SINGLE LETTER VIEW ===== */
  .letter-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .big-letter-card {
    background: #fff;
    border-radius: 32px;
    padding: 28px 36px;
    box-shadow: var(--card-shadow), 0 4px 0 #e0e0e0;
    display: flex;
    align-items: center;
    gap: 24px;
    cursor: pointer;
    transition: transform 0.18s var(--bounce), box-shadow 0.18s;
    animation: slideInUp 0.4s var(--bounce) both;
    width: 100%;
    max-width: 480px;
  }
  .big-letter-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 18px 48px rgba(0,0,0,0.2); }
  .big-letter-card:active { transform: scale(0.96); }

  @keyframes slideInUp {
    from { transform: translateY(60px) scale(0.85); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .letter-glyph {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(5rem, 16vw, 9rem);
    line-height: 1;
    background: linear-gradient(135deg, #F4845F, #FF6B9D);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    user-select: none;
    transition: transform 0.15s var(--bounce);
  }
  .big-letter-card:active .letter-glyph { transform: scale(0.85) rotate(-8deg); }

  .letter-info { text-align: left; flex: 1; }
  .letter-word {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    color: #333;
    line-height: 1.1;
  }
  .letter-subtext {
    font-size: 0.9rem;
    color: #888;
    font-weight: 700;
    margin-top: 4px;
  }
  .tap-hint {
    font-size: 0.78rem;
    color: #bbb;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 700;
  }

  /* Animal emoji large display */
  .animal-display {
    font-size: clamp(5rem, 18vw, 9rem);
    animation: animalBounce 0.6s var(--bounce) both;
    cursor: pointer;
    user-select: none;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.15));
    transition: transform 0.15s var(--bounce);
  }
  .animal-display:hover { transform: scale(1.08) rotate(3deg); }
  .animal-display:active { transform: scale(0.88) rotate(-8deg); }

  @keyframes animalBounce {
    0%  { transform: scale(0) rotate(-20deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(5deg); }
    100%{ transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .animal-name-tag {
    background: #fff;
    border-radius: 20px;
    padding: 10px 28px;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: #444;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    letter-spacing: 1px;
    animation: fadeIn 0.3s ease both;
    animation-delay: 0.2s;
    opacity: 0;
    animation-fill-mode: forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .sound-btn {
    background: linear-gradient(135deg, #F4845F, #FF6B9D);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 36px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(244,132,95,0.45);
    transition: all 0.18s var(--bounce);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: fadeIn 0.4s ease 0.3s both;
    opacity: 0;
  }
  .sound-btn:hover  { transform: scale(1.08) translateY(-3px); box-shadow: 0 10px 30px rgba(244,132,95,0.5); }
  .sound-btn:active { transform: scale(0.92); }
  .sound-btn.speaking { animation: speakPulse 0.4s ease infinite alternate; }
  @keyframes speakPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.06); box-shadow: 0 12px 36px rgba(244,132,95,0.7); }
  }

  /* ===== GRID VIEW ===== */
  .grid-view {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    animation: fadeIn 0.3s ease both;
  }
  .grid-card {
    background: #fff;
    border-radius: 22px;
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1), 0 3px 0 #e0e0e0;
    transition: all 0.2s var(--bounce);
    animation: popIn 0.3s var(--bounce) both;
    border: 3px solid transparent;
  }
  .grid-card:nth-child(1)  { animation-delay: 0.02s; }
  .grid-card:nth-child(2)  { animation-delay: 0.04s; }
  .grid-card:nth-child(3)  { animation-delay: 0.06s; }
  .grid-card:nth-child(4)  { animation-delay: 0.08s; }
  .grid-card:nth-child(5)  { animation-delay: 0.10s; }
  .grid-card:nth-child(6)  { animation-delay: 0.12s; }
  .grid-card:nth-child(7)  { animation-delay: 0.14s; }
  .grid-card:nth-child(8)  { animation-delay: 0.16s; }
  .grid-card:nth-child(9)  { animation-delay: 0.18s; }
  .grid-card:nth-child(10) { animation-delay: 0.20s; }

  @keyframes popIn {
    from { transform: scale(0.6) translateY(20px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }
  .grid-card:hover  { transform: translateY(-8px) scale(1.04); box-shadow: 0 16px 36px rgba(0,0,0,0.18); }
  .grid-card:active { transform: scale(0.92); }
  .grid-card.playing { border-color: #F4845F; background: #FFF5F2; }

  .grid-emoji { font-size: 2.8rem; line-height: 1; margin-bottom: 6px; display: block; }
  .grid-letter {
    font-family: 'Fredoka One', cursive;
    font-size: 1.6rem;
    background: linear-gradient(135deg, #F4845F, #FF6B9D);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: block;
  }
  .grid-name {
    font-size: 0.72rem;
    font-weight: 900;
    color: #888;
    letter-spacing: 0.5px;
    margin-top: 2px;
    display: block;
    text-transform: uppercase;
  }

  /* Quiz mode */
  .quiz-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: fadeIn 0.3s ease both;
  }
  .quiz-question {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    text-align: center;
  }
  .quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
    max-width: 420px;
  }
  .quiz-option {
    background: #fff;
    border: 3px solid transparent;
    border-radius: 22px;
    padding: 18px 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    transition: all 0.2s var(--bounce);
    font-family: 'Fredoka One', cursive;
  }
  .quiz-option:hover { transform: scale(1.05) translateY(-4px); }
  .quiz-option.correct { background: #C8F5C8; border-color: #4CAF50; animation: correctBounce 0.5s var(--bounce); }
  .quiz-option.wrong   { background: #FFE0E0; border-color: #E53935; animation: shake 0.4s ease; }
  @keyframes correctBounce {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.12); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-8px); }
    75%     { transform: translateX(8px); }
  }
  .quiz-option-emoji { font-size: 2.4rem; display: block; margin-bottom: 4px; }
  .quiz-option-letter {
    font-size: 1rem;
    color: #666;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
  }

  .score-bar {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .star-score { font-size: 1.5rem; filter: grayscale(1); transition: filter 0.3s; }
  .star-score.earned { filter: grayscale(0); animation: starPop 0.4s var(--bounce); }
  @keyframes starPop {
    0%  { transform: scale(0); }
    70% { transform: scale(1.3); }
    100%{ transform: scale(1); }
  }

  .next-btn {
    background: linear-gradient(135deg, #43C6AC, #191654);
    background: linear-gradient(135deg, #56CCF2, #2F80ED);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 40px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(86,204,242,0.4);
    transition: all 0.2s var(--bounce);
    display: none;
  }
  .next-btn.show { display: flex; align-items: center; gap: 8px; animation: fadeIn 0.3s ease both; }
  .next-btn:hover { transform: scale(1.08) translateY(-3px); }

  /* Mascot */
  .mascot {
    position: fixed;
    bottom: 20px; right: 20px;
    font-size: 3.5rem;
    z-index: 50;
    cursor: pointer;
    animation: mascotFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.2));
    user-select: none;
  }
  @keyframes mascotFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }
  .mascot-bubble {
    position: fixed;
    bottom: 88px; right: 16px;
    background: #fff;
    border-radius: 18px 18px 4px 18px;
    padding: 10px 16px;
    font-size: 0.82rem;
    font-weight: 700;
    color: #555;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    max-width: 180px;
    text-align: center;
    z-index: 50;
    opacity: 0;
    transform: scale(0.8) translateY(10px);
    transition: all 0.3s var(--bounce);
    pointer-events: none;
  }
  .mascot-bubble.show { opacity: 1; transform: scale(1) translateY(0); }

  /* Congrats overlay */
  .confetti-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .big-letter-card { padding: 20px 20px; gap: 16px; }
    .grid-view { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .quiz-options { gap: 10px; }
  }
</style>
</head>
<body>

<!-- Decorations -->
<div class="sun"></div>
<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>

<header>
  <div class="logo">🦁 AlphaZoo</div>
  <div class="tagline">Tap · Learn · Roar! 🌟</div>
</header>

<!-- Mode buttons -->
<div class="mode-bar">
  <button class="mode-btn active" onclick="setMode('learn')" id="mode-learn">📖 Learn</button>
  <button class="mode-btn inactive" onclick="setMode('explore')" id="mode-explore">🔍 Explore</button>
  <button class="mode-btn inactive" onclick="setMode('quiz')" id="mode-quiz">🎮 Quiz</button>
</div>

<!-- Alphabet tabs -->
<div class="tabs-wrapper" id="tabsWrapper">
  <div class="tabs" id="tabs"></div>
</div>

<!-- Stage -->
<div class="stage" id="stage"></div>

<!-- Mascot -->
<div class="mascot" id="mascot" onclick="mascotTalk()">🦊</div>
<div class="mascot-bubble" id="mascotBubble"></div>

<!-- Confetti -->
<div class="confetti-layer" id="confettiLayer"></div>

<script>
const ALPHABET = [
  { letter:'A', animal:'Alligator', emoji:'🐊', color:'#FF6B6B', sound:'A is for Alligator! A, A, Alligator!', phonetic:'Ayyy' },
  { letter:'B', animal:'Bear',      emoji:'🐻', color:'#FF9F43', sound:'B is for Bear! B, B, Bear!',         phonetic:'Buh' },
  { letter:'C', animal:'Cat',       emoji:'🐱', color:'#FECA57', sound:'C is for Cat! C, C, Cat!',           phonetic:'Kuh' },
  { letter:'D', animal:'Dog',       emoji:'🐶', color:'#48DBFB', sound:'D is for Dog! D, D, Dog!',           phonetic:'Duh' },
  { letter:'E', animal:'Elephant',  emoji:'🐘', color:'#FF9FF3', sound:'E is for Elephant! E, E, Elephant!', phonetic:'Ehh' },
  { letter:'F', animal:'Fox',       emoji:'🦊', color:'#F368E0', sound:'F is for Fox! F, F, Fox!',           phonetic:'Fuh' },
  { letter:'G', animal:'Giraffe',   emoji:'🦒', color:'#00D2D3', sound:'G is for Giraffe! G, G, Giraffe!',   phonetic:'Guh' },
  { letter:'H', animal:'Horse',     emoji:'🐴', color:'#54A0FF', sound:'H is for Horse! H, H, Horse!',       phonetic:'Huh' },
  { letter:'I', animal:'Iguana',    emoji:'🦎', color:'#5F27CD', sound:'I is for Iguana! I, I, Iguana!',     phonetic:'Ih' },
  { letter:'J', animal:'Jellyfish', emoji:'🪼', color:'#00D2D3', sound:'J is for Jellyfish! J, J, Jellyfish!', phonetic:'Juh' },
  { letter:'K', animal:'Kangaroo',  emoji:'🦘', color:'#FF6B6B', sound:'K is for Kangaroo! K, K, Kangaroo!', phonetic:'Kuh' },
  { letter:'L', animal:'Lion',      emoji:'🦁', color:'#FFA502', sound:'L is for Lion! L, L, Lion!',         phonetic:'Luh' },
  { letter:'M', animal:'Monkey',    emoji:'🐵', color:'#2ED573', sound:'M is for Monkey! M, M, Monkey!',     phonetic:'Muh' },
  { letter:'N', animal:'Narwhal',   emoji:'🦄', color:'#1E90FF', sound:'N is for Narwhal! N, N, Narwhal!',   phonetic:'Nuh' },
  { letter:'O', animal:'Octopus',   emoji:'🐙', color:'#FF6348', sound:'O is for Octopus! O, O, Octopus!',   phonetic:'Ohh' },
  { letter:'P', animal:'Penguin',   emoji:'🐧', color:'#747D8C', sound:'P is for Penguin! P, P, Penguin!',   phonetic:'Puh' },
  { letter:'Q', animal:'Quail',     emoji:'🐦', color:'#A29BFE', sound:'Q is for Quail! Q, Q, Quail!',       phonetic:'Kwuh' },
  { letter:'R', animal:'Rabbit',    emoji:'🐰', color:'#FD79A8', sound:'R is for Rabbit! R, R, Rabbit!',     phonetic:'Ruh' },
  { letter:'S', animal:'Snake',     emoji:'🐍', color:'#00B894', sound:'S is for Snake! S, S, Snake!',       phonetic:'Sss' },
  { letter:'T', animal:'Tiger',     emoji:'🐯', color:'#E17055', sound:'T is for Tiger! T, T, Tiger!',       phonetic:'Tuh' },
  { letter:'U', animal:'Unicorn',   emoji:'🦄', color:'#6C5CE7', sound:'U is for Unicorn! U, U, Unicorn!',   phonetic:'Uh' },
  { letter:'V', animal:'Vulture',   emoji:'🦅', color:'#636E72', sound:'V is for Vulture! V, V, Vulture!',   phonetic:'Vuh' },
  { letter:'W', animal:'Whale',     emoji:'🐋', color:'#0984E3', sound:'W is for Whale! W, W, Whale!',       phonetic:'Wuh' },
  { letter:'X', animal:'X-ray Fish',emoji:'🐟', color:'#74B9FF', sound:'X is for X-ray Fish! X, X, X-ray Fish!', phonetic:'Ks' },
  { letter:'Y', animal:'Yak',       emoji:'🐃', color:'#BADC58', sound:'Y is for Yak! Y, Y, Yak!',           phonetic:'Yuh' },
  { letter:'Z', animal:'Zebra',     emoji:'🦓', color:'#535C68', sound:'Z is for Zebra! Z, Z, Zebra!',       phonetic:'Zuh' },
];

let currentIdx = 0;
let currentMode = 'learn';
let quizState = { score: 0, answered: false, current: null, options: [] };
const synth = window.speechSynthesis;

// ── TABS ──────────────────────────────────────────────────────────────────────
function buildTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  ALPHABET.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === currentIdx ? ' active' : '');
    btn.textContent = item.letter;
    btn.onclick = () => selectLetter(i);
    tabs.appendChild(btn);
  });
}

function updateTabs() {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIdx);
    if (i === currentIdx) b.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  });
}

function selectLetter(idx) {
  currentIdx = idx;
  updateTabs();
  if (currentMode === 'learn')   renderLearn();
  else if (currentMode === 'explore') renderExplore();
}

// ── MODES ─────────────────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  ['learn','explore','quiz'].forEach(m => {
    document.getElementById('mode-'+m).className = 'mode-btn ' + (m===mode?'active':'inactive');
  });
  const tabsWrapper = document.getElementById('tabsWrapper');
  tabsWrapper.style.display = mode === 'quiz' ? 'none' : 'block';
  if (mode === 'learn')   renderLearn();
  if (mode === 'explore') renderExplore();
  if (mode === 'quiz')    renderQuiz();
}

// ── LEARN MODE ────────────────────────────────────────────────────────────────
function renderLearn() {
  const item = ALPHABET[currentIdx];
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="letter-view">
      <div class="big-letter-card" onclick="speakFull(${currentIdx})" id="mainCard">
        <div class="letter-glyph">${item.letter}</div>
        <div class="letter-info">
          <div class="letter-word">${item.letter} for ${item.animal}</div>
          <div class="letter-subtext">Say: "${item.phonetic}"</div>
          <div class="tap-hint">👆 Tap me!</div>
        </div>
      </div>
      <div class="animal-display" id="animalEmoji" onclick="speakAnimal(${currentIdx})">${item.emoji}</div>
      <div class="animal-name-tag">${item.animal}</div>
      <button class="sound-btn" id="soundBtn" onclick="speakFull(${currentIdx})">
        🔊 Hear it!
      </button>
    </div>
  `;
  // Auto-speak after short delay
  setTimeout(() => speakFull(currentIdx), 500);
}

function speakFull(idx) {
  const item = ALPHABET[idx];
  speak(item.sound);
  const btn = document.getElementById('soundBtn');
  if (btn) { btn.classList.add('speaking'); setTimeout(()=>btn.classList.remove('speaking'), 2000); }
  spawnSparkles();
}
function speakAnimal(idx) {
  speak(ALPHABET[idx].animal);
  spawnSparkles();
}

// ── EXPLORE MODE (A-Z grid) ───────────────────────────────────────────────────
function renderExplore() {
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="grid-view" id="gridView"></div>`;
  const grid = document.getElementById('gridView');
  ALPHABET.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'grid-card';
    card.id = 'gc-'+i;
    card.innerHTML = `
      <span class="grid-emoji">${item.emoji}</span>
      <span class="grid-letter">${item.letter}</span>
      <span class="grid-name">${item.animal}</span>
    `;
    card.onclick = () => {
      document.querySelectorAll('.grid-card').forEach(c=>c.classList.remove('playing'));
      card.classList.add('playing');
      speak(item.sound);
      spawnSparkles();
      setTimeout(()=>card.classList.remove('playing'), 2200);
    };
    grid.appendChild(card);
  });
}

// ── QUIZ MODE ─────────────────────────────────────────────────────────────────
function renderQuiz() {
  // Pick random correct answer
  const correctIdx = Math.floor(Math.random() * 26);
  const correct = ALPHABET[correctIdx];
  // Pick 3 wrong answers
  let wrongIndices = [];
  while (wrongIndices.length < 3) {
    const r = Math.floor(Math.random() * 26);
    if (r !== correctIdx && !wrongIndices.includes(r)) wrongIndices.push(r);
  }
  // Shuffle options
  const options = [correctIdx, ...wrongIndices].sort(() => Math.random()-0.5);
  quizState = { score: quizState.score, answered: false, correctIdx, options };

  const stars = '⭐'.repeat(Math.min(quizState.score, 5)) + (quizState.score < 5 ? '☆'.repeat(5 - Math.min(quizState.score, 5)) : '');
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="quiz-view">
      <div class="score-bar" id="scoreBar">${buildStars()}</div>
      <div class="quiz-question">Which animal starts with the letter<br><span style="font-size:3rem;background:linear-gradient(135deg,#F4845F,#FF6B9D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${correct.letter}</span> ?</div>
      <div class="quiz-options" id="quizOptions">
        ${options.map(idx => `
          <div class="quiz-option" id="qo-${idx}" onclick="answerQuiz(${idx})">
            <span class="quiz-option-emoji">${ALPHABET[idx].emoji}</span>
            <span class="quiz-option-letter">${ALPHABET[idx].animal}</span>
          </div>
        `).join('')}
      </div>
      <button class="next-btn" id="nextBtn" onclick="renderQuiz()">Next ➡️</button>
    </div>
  `;
  // speak question
  setTimeout(() => speak(`Which animal starts with the letter ${correct.letter}?`), 300);
}

function buildStars() {
  let h = '';
  for (let i=0;i<5;i++) {
    h += `<span class="star-score${i < quizState.score ? ' earned':''}" id="star${i}">${i < quizState.score ? '⭐':'☆'}</span>`;
  }
  return h;
}

function answerQuiz(idx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const correct = idx === quizState.correctIdx;
  document.getElementById('qo-'+idx).classList.add(correct ? 'correct' : 'wrong');
  if (correct) {
    quizState.score = Math.min(quizState.score + 1, 5);
    speak('Yay! Correct! Great job!');
    spawnSparkles(); spawnConfetti();
  } else {
    document.getElementById('qo-'+quizState.correctIdx).classList.add('correct');
    speak('Oops! That is ' + ALPHABET[quizState.correctIdx].animal + '! Try again!');
    quizState.score = Math.max(quizState.score - 1, 0);
  }
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('scoreBar').innerHTML = buildStars();
}

// ── SPEECH ────────────────────────────────────────────────────────────────────
function speak(text) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.82;
  u.pitch = 1.3;
  u.volume = 1;
  // Try to pick a friendly voice
  const voices = synth.getVoices();
  const preferred = voices.find(v => /female|girl|zira|samantha|karen|moira|tessa|fiona/i.test(v.name))
                 || voices.find(v => v.lang.startsWith('en'))
                 || voices[0];
  if (preferred) u.voice = preferred;
  synth.speak(u);
}
// voices load async
window.speechSynthesis.onvoiceschanged = () => {};

// ── FX ────────────────────────────────────────────────────────────────────────
function spawnSparkles() {
  const emojis = ['⭐','✨','🌟','💫','🎉','❤️','🎈'];
  for (let i=0;i<5;i++) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = (20+Math.random()*60)+'vw';
    el.style.top  = (30+Math.random()*40)+'vh';
    el.style.animationDelay = (Math.random()*0.4)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1600);
  }
}

function spawnConfetti() {
  const layer = document.getElementById('confettiLayer');
  const colors = ['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#FF6BC8','#FF9F43'];
  for (let i=0;i<40;i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.5+Math.random()*2)+'s';
    p.style.animationDelay = (Math.random()*0.8)+'s';
    p.style.borderRadius = Math.random()>0.5?'50%':'2px';
    layer.appendChild(p);
    setTimeout(()=>p.remove(), 3500);
  }
}

// ── MASCOT ────────────────────────────────────────────────────────────────────
const mascotLines = [
  "Tap any animal to hear its name! 🦁",
  "Great job learning! Keep going! 🎉",
  "Can you say the letter out loud? 📢",
  "Try Quiz mode to test yourself! 🎮",
  "You're a superstar learner! ⭐",
  "Explore all 26 animals! 🌍",
  "Learning is so much FUN! 🎈",
];
let mascotTimer;
function mascotTalk() {
  const bubble = document.getElementById('mascotBubble');
  const line = mascotLines[Math.floor(Math.random()*mascotLines.length)];
  bubble.textContent = line;
  bubble.classList.add('show');
  speak(line.replace(/[^\w\s!]/g,''));
  clearTimeout(mascotTimer);
  mascotTimer = setTimeout(()=>bubble.classList.remove('show'), 4000);
}
setTimeout(()=>mascotTalk(), 2000);

// ── KEYBOARD SUPPORT ──────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (currentMode === 'quiz') return;
  if (e.key === 'ArrowRight') selectLetter((currentIdx+1)%26);
  if (e.key === 'ArrowLeft')  selectLetter((currentIdx+25)%26);
  const idx = ALPHABET.findIndex(a=>a.letter===e.key.toUpperCase());
  if (idx>=0) selectLetter(idx);
});

// ── INIT ──────────────────────────────────────────────────────────────────────
buildTabs();
renderLearn();
</script>
</body>
</html>
